name: Build Release

# 打 tag (v*) 自动构建 Windows + macOS(arm64)预编译版并发 Release；
# workflow_dispatch 可手动触发(仅出 artifact,不发 Release)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: TCER-windows-x64
            ext: .exe
            icon: tcer/gui/assets/tcer_logo.ico
            sep: ';'                    # Windows add-data 分隔符
          - os: macos-latest            # = Apple Silicon / M 芯片 runner
            asset_name: TCER-macos-arm64
            ext: .zip                   # mac 打包成 .app.zip（双击友好，保留可执行权限）
            icon: tcer_logo.icns         # CI 内现生成
            sep: ':'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash                      # Windows runner 也走 Git Bash,统一 mv / sep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Python 3.14 官方 Windows / macOS 构建内置最新 Tcl/Tk 9.0.4 与标准库 compression.zstd
          python-version: '3.14'

      - name: Verify Python & Tcl/Tk runtime
        run: |
          python - <<'PY'
          import sys, tkinter
          tcl_ver = tkinter.Tcl().eval("info patchlevel")
          print(f"Python {sys.version} | Tcl/Tk patchlevel: {tcl_ver} | TkVersion: {tkinter.TkVersion}")
          # 三层圆角管线必须逐层实测，不能只测 SDF 编码器——SVG 层回归会静默
          # 回退到低层，用户机器上才第一次跑到。CI（Tk 9.0.4）是 SVG 档的
          # 唯一机器验证点。
          from tcer.gui import widgets
          png = widgets._render_sdf_png_bytes(48, 24, 6, "#232323", "#1e1e1e", "#303030", 1)
          assert png.startswith(b"\x89PNG\r\n\x1a\n") and len(png) > 64
          root = tkinter.Tk()
          root.withdraw()
          assert widgets._has_tk9_svg(root), "Tk 9 原生 SVG PhotoImage 探测失败"
          img = widgets.get_rounded_rect_img(root, 64, 28, 8, "#232323", "#1e1e1e",
                                             outline="#303030", outline_width=1)
          assert img is not None and img.width() == 64 and img.height() == 28
          cv = tkinter.Canvas(root, width=120, height=60, bg="#1e1e1e", highlightthickness=0)
          widgets.draw_rounded_box(cv, 120, 60, 8, "#232323", "#1e1e1e",
                                   outline="#303030", tag="ci_box")
          assert cv.find_withtag("ci_box_tl"), "9-slice 四角贴图未绘制"
          print(f"SVG tier OK (TkVersion={tkinter.TkVersion}) | 9-slice OK")
          root.destroy()
          PY

      - name: Stamp version from tag      # v1.2.3 -> tcer/__init__.py __version__="1.2.3"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = pathlib.Path("tcer/__init__.py")
          p.write_text(re.sub(r'^__version__ = .*$', f'__version__ = "{tag}"',
                              p.read_text(encoding="utf-8"), flags=re.M),
                       encoding="utf-8")
          print("stamped", tag)
          PY

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Generate .icns (macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p logo.iconset
          SRC=tcer/gui/assets/tcer_logo.png
          sips -z 16 16     "$SRC" --out logo.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out logo.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out logo.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out logo.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512   "$SRC" --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 "$SRC" --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o tcer_logo.icns

      - name: Build (PyInstaller)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # mac：--windowed（无 --onefile）生成 dist/TCER.app bundle，双击友好。
            # 不用 --onefile：onefile 产裸 Mach-O 单文件，mac 双击会丢权限 + quarantine 报错。
            pyinstaller --noconfirm --windowed \
              --name TCER \
              --icon "${{ matrix.icon }}" \
              --add-data "tcer/config${{ matrix.sep }}tcer/config" \
              --add-data "tcer/gui/assets${{ matrix.sep }}tcer/gui/assets" \
              tcer/__main__.py
          else
            # Windows：--onefile 单 exe
            pyinstaller --noconfirm --onefile --windowed \
              --name TCER \
              --icon "${{ matrix.icon }}" \
              --add-data "tcer/config${{ matrix.sep }}tcer/config" \
              --add-data "tcer/gui/assets${{ matrix.sep }}tcer/gui/assets" \
              tcer/__main__.py
          fi

      - name: Verify PyInstaller bundle
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "dist/TCER.app/Contents/MacOS/TCER"
            du -sh "dist/TCER.app"
          else
            test -s "dist/TCER.exe"
            ls -lh "dist/TCER.exe"
          fi

      - name: Package asset              # 资产名含版本号：TCER-windows-x64-v1.5.2.exe / TCER-macos-arm64-v1.5.2.zip
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto 打 zip（保留 unix 可执行权限；普通 zip / 浏览器解压会丢权限）
            ditto -c -k --keepParent "dist/TCER.app" "${{ matrix.asset_name }}-${{ github.ref_name }}.zip"
          else
            mv "dist/TCER${{ matrix.ext }}" "${{ matrix.asset_name }}-${{ github.ref_name }}${{ matrix.ext }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-${{ github.ref_name }}
          path: ${{ matrix.asset_name }}-${{ github.ref_name }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # 仅 tag 触发才发 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # 取 doc/RELEASE_NOTES.md 作为手写发布说明
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: doc/RELEASE_NOTES.md  # 手写发布说明（替代自动生成的提交记录）
