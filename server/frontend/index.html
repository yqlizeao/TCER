<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCER 效率分析</title>
<link rel="icon" type="image/png" href="assets/tcer_logo_64.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login gate -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="assets/tcer_logo_128.png" alt="TCER" width="64" height="64">
    <div class="login-brand">TCER</div>
    <div class="login-sub">AI 编程效率分析</div>
    <form id="login-form" class="login-pw hidden">
      <input id="login-user" type="text" placeholder="账号" autocomplete="username">
      <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
      <button type="submit" class="btn-primary">登录</button>
    </form>
    <div id="login-divider" class="login-divider hidden"><span>或</span></div>
    <button id="login-feishu" class="btn-feishu hidden" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12c4-5 9-7 16-7-3 6-8 11-16 14v-7z" fill="currentColor"/></svg>
      使用飞书登录
    </button>
    <div id="login-err" class="login-err"></div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="app hidden">
  <aside class="rail">
    <div class="rail-brand"><img class="rail-logo" src="assets/tcer_logo_64.png" alt="" width="24" height="24"><span>TCER</span></div>
    <nav class="rail-nav" id="rail-nav">
      <button class="rail-item active" data-view="projects">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        <span class="rail-tx">项目总览</span><span class="rail-hint">ROI · AI 渗透</span>
      </button>
      <button class="rail-item" data-view="exec">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 6.5c0-2-2.2-3-5-3s-5 1-5 3 2.2 3 5 3.5 5 1.5 5 3.5-2.2 3-5 3-5-1-5-3"/></svg></span>
        <span class="rail-tx">投入产出</span><span class="rail-hint">花了多少 · 换来多少</span>
      </button>
      <button class="rail-item" data-view="engineering">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 5-6"/></svg></span>
        <span class="rail-tx">工程效能</span><span class="rail-hint">采用 · 质量 · 短板</span>
      </button>
      <button class="rail-item" data-view="diagnosis">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg></span>
        <span class="rail-tx">问题诊断</span><span class="rail-hint">分级建议 · 证据</span>
      </button>
      <button class="rail-item" data-view="sessions">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h10"/></svg></span>
        <span class="rail-tx">会话明细</span><span class="rail-hint">逐条查看</span>
      </button>
      <button class="rail-item" data-view="tokens">
        <span class="rail-ic"><svg viewBox="0 0 24 24"><path d="M15 7a4 4 0 11-4 4h-7"/><path d="M7 11v4"/><path d="M11 11v3"/></svg></span>
        <span class="rail-tx">Auth Token</span><span class="rail-hint">上传凭据管理</span>
      </button>
    </nav>
    <div class="rail-foot">
      <div class="user">
        <span id="user-avatar" class="user-avatar"></span>
        <span id="who" class="who"></span>
      </div>
      <button id="logout" class="btn-ghost">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="view-title">项目总览</div>
      <div class="topbar-filters">
        <div class="fg">
          <span class="fg-label">时间范围</span>
          <div class="seg" id="range-seg">
            <button data-days="7" class="active">近 7 天</button>
            <button data-days="30">近 30 天</button>
            <button data-days="90">近 90 天</button>
            <button data-days="0">全部</button>
          </div>
        </div>
        <div class="fg">
          <span class="fg-label">成员</span>
          <select id="f-person" class="filter" title="按成员筛选（可多选）" multiple size="1"></select>
        </div>
        <div class="fg">
          <span class="fg-label">项目</span>
          <select id="f-project" class="filter" title="按项目筛选（可多选）" multiple size="1"></select>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<script src="vendor/echarts.min.js"></script>
<!-- 前端按序加载（经典脚本，共享作用域）；打包时按此顺序拼接即可 -->
<script src="js/core.js"></script>
<script src="js/view-projects.js"></script>
<script src="js/view-exec.js"></script>
<script src="js/view-engineering.js"></script>
<script src="js/view-diagnosis.js"></script>
<script src="js/view-sessions.js"></script>
<script src="js/view-tokens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
